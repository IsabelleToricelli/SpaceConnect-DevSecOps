<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta name="viewport" content="widht=device-widht, initial-scale=1.0">
    <title> SpaceConnect - Painel de Telemetria </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SpaceConnect</h1>
            <p>Sistema de Monitoramento de Satélites e Clima</p>
        </header>

        <main>
            <section class="card">
                <h2>Status da Conexáo Orbital </h2>
                <div id="status-container">
                    <p>Status: <span class="badge" id="status-text" >Aguardando autenticação.....</span></p>
                </div>
                <button id="btn-conectar" class="btn">Conectar á API de telemetria </button>
            </section>

            <section class="card">
                <h2>Enviar comando ao satélite </h2>
                <div class="form-group">
                    <label for="comando-input">Digite o código do comando:</label>
                    <input type="text" id="comando-input" placeholder="Ex? ALTITUDE_100">
                </div>
                <button id="btn-enviar" class="btn">Enviar comando</button>
                <div id="resultado-comando"></div>
            </section>
        </main>

        <footer>
            <p>SpaceConnect &copy/ 2026 - Sistema Protegido (Simulação DevSecOps) </p>
        </footer>

        <script src="script.js"></script>


    </div>
</body>
</html>
